services:
  - type: web
    name: erp-vinamik-demo-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ERP_Backend/Dockerfile
    dockerContext: ./ERP_Backend
    autoDeployTrigger: off
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-vinamik-demo-db
          property: connectionString
      - key: ERP_DB_USERNAME
        fromDatabase:
          name: erp-vinamik-demo-db
          property: user
      - key: ERP_DB_PASSWORD
        fromDatabase:
          name: erp-vinamik-demo-db
          property: password
      - key: ERP_FLYWAY_ENABLED
        value: "true"
      - key: ERP_AUTH_SECURE_COOKIE
        value: "true"
      - key: ERP_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: ERP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: erp-vinamik-demo-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    rootDir: ERP_Client
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_DEMO_USERNAME
        value: admin
      - key: VITE_DEMO_PASSWORD
        fromService:
          type: web
          name: erp-vinamik-demo-backend
          envVarKey: ERP_BOOTSTRAP_ADMIN_PASSWORD
    routes:
      - type: rewrite
        source: /api/*
        destination: https://erp-vinamik-demo-backend.onrender.com/api/*
      - type: rewrite
        source: /actuator/*
        destination: https://erp-vinamik-demo-backend.onrender.com/actuator/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: erp-vinamik-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
