spring.application.name=erp_backend
spring.datasource.url=${ERP_DB_URL:jdbc:postgresql://localhost:5432/erp_vinamik}
spring.datasource.username=${ERP_DB_USERNAME:erp_vinamik}
spring.datasource.password=${ERP_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=${ERP_DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.maximum-pool-size=${ERP_DB_POOL_SIZE:10}
spring.flyway.enabled=${ERP_FLYWAY_ENABLED:true}
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration/identity,classpath:db/migration/hr,classpath:db/migration/inventory,classpath:db/migration/production,classpath:db/migration/quality_cost
spring.flyway.sql-migration-prefix=v

erp.auth.session-ttl-seconds=${ERP_AUTH_SESSION_TTL_SECONDS:43200}
erp.auth.secure-cookie=${ERP_AUTH_SECURE_COOKIE:false}
erp.bootstrap-admin.username=${ERP_BOOTSTRAP_ADMIN_USERNAME:}
erp.bootstrap-admin.password=${ERP_BOOTSTRAP_ADMIN_PASSWORD:}
server.error.include-message=never
server.error.include-stacktrace=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${ERP_SHUTDOWN_TIMEOUT:20s}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState


erp.fixture.stocktake.enabled=${ERP_FIXTURE_STOCKTAKE_ENABLED:false}

erp.fixture.contract.enabled=${ERP_FIXTURE_CONTRACT_ENABLED:false}
