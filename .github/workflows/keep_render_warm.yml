name: Keep Render demo warm

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions: {}

jobs:
  warm_backend:
    name: Wake backend before demo traffic
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check backend readiness
        env:
          backend_url: ${{ vars.RENDER_BACKEND_PUBLIC_URL || 'https://erp-vinamik-demo-backend.onrender.com' }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 90 \
            "$backend_url/actuator/health/readiness"
